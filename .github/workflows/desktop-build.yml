# DeepSeek Harness Desktop — Windows x64 免签名打包（首跑修正版 v2）
#
# 放置位置：.github/workflows/desktop-build.yml
#
# v2 相对 v1 的修改：
#   Package 步骤由 shell: bash 改为 shell: pwsh。
#   原因：上游 apps/desktop/scripts/prepare-package-set.ts 直接调用 `tar -xOzf <绝对路径>`
#   （见该文件 packedManifest 函数）。在 Git Bash 下 `tar` 解析为 GNU tar，
#   会把 Windows 路径 `D:\a\...` 当作远程主机（host:path 语法），报
#   「tar (child): Cannot connect to D: resolve failed」。
#   改用 pwsh 后 `tar` 解析为 C:\Windows\System32\tar.exe（bsdtar），可正常读取盘符路径。
#
# 其余说明同 v1：
#   - 上游 SUPPORTED_TARGETS 仅 mac-arm64 / mac-x64 / win-x64，Linux/AppImage 在解析阶段被拒。
#   - 本流水线产出免签名包，不需要 EV 证书或 COS 上传凭证。
#   - .env.windows 用仓库变量覆盖，未配置时回落到本机回环占位。

name: Package Desktop (Windows x64)

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: '可选构建版本号（例如 0.2.2-rc.3.20261115.1）。留空则使用 apps/desktop/package.json 中的版本。'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'desktop-v*'

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DSH_DESKTOP_PACKAGE_CACHE_DIR: ${{ github.workspace }}/.desktop-cache

jobs:
  package:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm 11.28.5
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm --version

      - name: Show tar implementation
        shell: pwsh
        run: |
          (Get-Command tar).Source
          tar --version

      - name: Restore package cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.desktop-cache
          key: dsh-package-win-x64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            dsh-package-win-x64-

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Write .env.windows
        shell: pwsh
        env:
          APP_ID: ${{ vars.DSH_DESKTOP_APP_ID || 'com.deepseek.dsh' }}
          POLICY_ORIGIN: ${{ vars.DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN || 'https://127.0.0.1:1' }}
          AUTH_ORIGIN: ${{ vars.DSH_DESKTOP_MANDATORY_UPDATE_AUTH_ORIGIN || 'https://127.0.0.1:1' }}
        run: |
          $config = '{"allowedAuthOrigins":["' + $env:AUTH_ORIGIN + '"]}'
          $lines = @(
            'DSH_DESKTOP_APP_ID=' + $env:APP_ID
            'DSH_DESKTOP_AUTO_UPDATE_ENV=test'
            'DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=' + $env:POLICY_ORIGIN
            'DSH_DESKTOP_MANDATORY_UPDATE_CONFIG=' + $config
            'DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3'
          )
          Set-Content -LiteralPath 'apps/desktop/.env.windows' -Value $lines -Encoding utf8

      - name: Package (checkout version)
        if: inputs.build_version == ''
        shell: pwsh
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Package (explicit version)
        if: inputs.build_version != ''
        shell: pwsh
        run: pnpm run package:desktop:win:x64:unsigned -- --build-version ${{ inputs.build_version }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-windows-x64-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-logs-windows-x64
          path: apps/desktop/.desktop-build/packaging-runs
          if-no-files-found: ignore
          retention-days: 14
